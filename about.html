<body>
<x-dc>
<helmet>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);-webkit-font-smoothing:antialiased}
  .vlink{transition:color .25s}.vlink:hover{color:var(--c-paper-50) !important}
  .vbtn{transition:transform .25s,background .25s,color .25s,border-color .25s}
  .vbtn:hover{transform:translateY(-2px)}
  .vsoc{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-med);color:var(--gold);text-decoration:none;transition:transform .25s,color .25s,border-color .25s}
  .vsoc:hover{transform:translateY(-2px);color:var(--gold-soft);border-color:var(--line-strong)}
</style>
</helmet>

<div style="font-family:Spectral,serif;color:var(--text);background:var(--bg);overflow-x:hidden;min-height:100vh">

  <dc-import name="SiteHeader" lang="{{ lang }}" active="author" on-lang="{{ setLang }}" hint-size="100%,66px"></dc-import>

  <!-- HERO -->
  <section style="padding:150px 7vw 60px">
    <div style="max-width:var(--container);margin:0 auto;display:flex;gap:60px;align-items:center;flex-wrap:wrap">
      <div style="position:relative;width:300px;height:380px;flex-shrink:0;border-radius:3px;overflow:hidden;border:1px solid rgba(var(--gold-rgb),.25);box-shadow:0 22px 50px rgba(0,0,0,.55);background:#1c1812">
        <img src="assets/img/author.jpg" alt="Ростислав Вишневский" style="width:100%;height:100%;object-fit:cover;display:block">
      </div>
      <div style="flex:1;min-width:300px">
        <div style="font:400 11px Spectral,serif;color:var(--gold-text);letter-spacing:5px;margin-bottom:18px">{{ t.kicker }}</div>
        <h1 style="font:400 clamp(38px,5.6vw,68px) Forum,serif;color:var(--c-paper-50);margin:0 0 12px;line-height:1.02">{{ t.name }}</h1>
        <div style="font:300 italic 18px Spectral,serif;color:var(--gold);margin-bottom:26px">{{ t.role }}</div>
        <p style="font:300 clamp(16px,2vw,19px)/1.7 Spectral,serif;color:#c8bca6;margin:0;max-width:520px">{{ t.lead }}</p>
      </div>
    </div>
  </section>

  <!-- STORY -->
  <section style="padding:50px 7vw;background:#100d0a;border-top:1px solid rgba(var(--gold-rgb),.12);border-bottom:1px solid rgba(var(--gold-rgb),.12)">
    <div style="max-width:760px;margin:0 auto">
      <div style="font:400 11px Spectral,serif;color:var(--gold-text);letter-spacing:5px;margin-bottom:24px;text-align:center">{{ t.storyKicker }}</div>
      <sc-if value="{{ t.storyTitle }}" hint-placeholder-val="{{ false }}">
        <h2 style="font:400 clamp(26px,3.6vw,40px) Forum,serif;color:#f0e6d2;margin:0 0 28px;text-align:center;line-height:1.15">{{ t.storyTitle }}</h2>
      </sc-if>
      <p style="font:300 17px/1.85 Spectral,serif;color:#bdb19c;margin:0 0 30px">{{ t.story1 }}</p>
      <sc-if value="{{ t.story2 }}" hint-placeholder-val="{{ false }}">
        <p style="font:300 17px/1.85 Spectral,serif;color:#bdb19c;margin:0 0 30px">{{ t.story2 }}</p>
      </sc-if>
      <div style="text-align:right">
        <div style="font:600 30px Caveat,cursive;color:var(--gold)">{{ t.name }}</div>
      </div>
    </div>
  </section>

  <!-- VIDEO -->
  <section style="padding:80px 7vw;border-bottom:1px solid rgba(var(--gold-rgb),.12)">
    <div style="max-width:900px;margin:0 auto;text-align:center">
      <div style="font:400 11px Spectral,serif;color:var(--gold-text);letter-spacing:5px;margin-bottom:16px">{{ t.videoKicker }}</div>
      <h2 style="font:400 clamp(26px,3.6vw,42px) Forum,serif;color:#f0e6d2;margin:0 0 14px">{{ t.videoTitle }}</h2>
      <sc-if value="{{ t.videoText }}" hint-placeholder-val="{{ false }}">
        <p style="font:300 16px/1.6 Spectral,serif;color:#a89c84;max-width:520px;margin:0 auto 32px">{{ t.videoText }}</p>
      </sc-if>
      <sc-if value="{{ hasVideo }}" hint-placeholder-val="{{ false }}">
      <div style="position:relative;padding-bottom:56.25%;height:0;border-radius:5px;overflow:hidden;border:1px solid rgba(var(--gold-rgb),.25);box-shadow:0 24px 56px rgba(0,0,0,.55)">
        <iframe src="{{ videoUrl }}" title="{{ t.videoTitle }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
      </sc-if>
      <sc-if value="{{ noVideo }}" hint-placeholder-val="{{ true }}">
        <!-- ролика пока нет: пустая рамка (VIDEO_ID в логике страницы) -->
        <div style="position:relative;padding-bottom:56.25%;height:0;margin-top:18px;border-radius:5px;overflow:hidden;border:1px solid rgba(var(--gold-rgb),.2);background:radial-gradient(120% 100% at 50% 0,rgba(var(--gold-rgb),.04),#120f0c)"></div>
      </sc-if>
    </div>
  </section>

  <!-- CTA -->
  <section style="padding:30px 7vw 90px">
    <div style="max-width:var(--container);margin:0 auto;text-align:center;border:1px solid rgba(var(--gold-rgb),.2);border-radius:4px;padding:54px 30px;background:radial-gradient(120% 100% at 50% 0,rgba(var(--gold-rgb),.05),transparent)">
      <sc-if value="{{ t.ctaTitle }}" hint-placeholder-val="{{ false }}">
        <h2 style="font:400 clamp(24px,3.4vw,38px) Forum,serif;color:#f0e6d2;margin:0 0 14px">{{ t.ctaTitle }}</h2>
      </sc-if>
      <p style="font:300 16px/1.6 Spectral,serif;color:#a89c84;margin:0 auto 30px;max-width:460px">{{ t.ctaText }}</p>
      <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
        <a href="book.html" class="vbtn" style="background:var(--gold);color:var(--bg-2);font:500 14.5px Spectral,serif;letter-spacing:1px;padding:15px 32px;text-decoration:none;border-radius:2px">{{ t.ctaRead }}</a>
        <a href="contacts.html" class="vbtn" style="border:1px solid rgba(var(--gold-rgb),.45);color:#e3d6bd;font:400 14.5px Spectral,serif;letter-spacing:1px;padding:15px 32px;text-decoration:none;border-radius:2px">{{ t.ctaWrite }}</a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <dc-import name="SiteFooter" lang="{{ lang }}" hint-size="100%,320px"></dc-import>

</div>
</x-dc>
