; Лимиты PHP для сохранения из редактора (картинки, аудио глав).
; Действуют, если PHP на хостинге работает как FPM/CGI (так почти везде). Если хостинг их не применяет,
; выставьте те же значения в панели хостинга: «Настройки PHP» / «Select PHP Version → Options».
upload_max_filesize = 100M
post_max_size = 110M
max_file_uploads = 50
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
